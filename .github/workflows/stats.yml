name: 📊 Generate Stats Cards

"on":
  schedule:
    - cron: "0 3 * * *"
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: stats-generation
  cancel-in-progress: false

jobs:
  build:
    name: Render stats + top-languages cards as static SVGs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: 📊 Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true"
          path: profile/stats.svg
          token: ${{ github.token }}

      - name: 🛠️ Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&theme=tokyonight&hide_border=true"
          path: profile/top-langs.svg
          token: ${{ github.token }}

      - name: 💾 Commit generated cards
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 chore: refresh stats cards [skip ci]"
          file_pattern: "profile/*.svg"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
