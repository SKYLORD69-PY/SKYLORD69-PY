name: 🔄 Update README — Live Repo Sync

"on":
  schedule:
    # Runs every 12 hours — 00:00 and 12:00 UTC
    - cron: "0 */12 * * *"
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: readme-sync
  cancel-in-progress: false

jobs:
  update-readme:
    name: Sync live repository data into README.md
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v5

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Install dependencies
        run: pip install --upgrade requests

      - name: ⚙️ Run update_repos.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_repos.py

      - name: 💾 Commit and push if README changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 chore: refresh live repo data [skip ci]"
          file_pattern: "README.md"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
