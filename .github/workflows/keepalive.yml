name: Keepalive Safety Net

# Optional safety net. Run this manually only when you deliberately
# want to record a last-verified-alive timestamp.
#
# This intentionally does NOT use a third-party "keepalive" Action.
# Some users have reported those tripping GitHub's abuse detection
# when they fire on every run regardless of need -- see the
# discussion linked in SETUP.md. Hand-rolling ~10 lines of bash that
# only acts when genuinely necessary avoids that risk entirely.

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-repository-commit
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Allow at most two repository commits per UTC day
        id: commit_gate
        run: |
          git fetch origin main --quiet
          commits_today=$(git rev-list --count --since="$(date -u +%Y-%m-%d) 00:00:00 UTC" origin/main)
          echo "Repository commits today: $commits_today"
          if [ "$commits_today" -lt 2 ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "Daily commit limit reached; skipping this update."
          fi

      - name: Check age of last commit
        id: age
        run: |
          last_commit=$(git log -1 --format=%ct)
          now=$(date +%s)
          days=$(( (now - last_commit) / 86400 ))
          echo "Last commit was $days day(s) ago."
          echo "days=$days" >> "$GITHUB_OUTPUT"

      - name: Touch a real timestamp file if we're approaching the 60-day limit
        if: fromJSON(steps.age.outputs.days) >= 50 && steps.commit_gate.outputs.allowed == 'true'
        run: |
          mkdir -p data
          date -u +"Last verified alive: %Y-%m-%dT%H:%M:%SZ" > data/.keepalive
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/.keepalive
          git commit -m "chore: keepalive - no other workflow has committed in 50+ days [skip ci]"
          git push
