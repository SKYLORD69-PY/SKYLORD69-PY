name: Game of Life

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-repository-commit
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Allow at most two repository commits per UTC day
        id: commit_gate
        run: |
          git fetch origin main --quiet
          commits_today=$(git rev-list --count --since="$(date -u +%Y-%m-%d) 00:00:00 UTC" origin/main)
          echo "Repository commits today: $commits_today"
          if [ "$commits_today" -lt 2 ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "Daily commit limit reached; skipping this update."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render contribution graph as Conway's Game of Life
        env:
          GH_PAT: ${{ secrets.GH_PAT }}   # needs read:user scope — see SETUP.md
          TARGET_USER: SKYLORD69-PY
        run: python scripts/game_of_life.py

      - name: Commit changes
        if: steps.commit_gate.outputs.allowed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: re-simulate game of life from latest contributions [skip ci]"
          file_pattern: "assets/game-of-life.svg"
