name: Game of Life

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: game-of-life
  cancel-in-progress: true

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render contribution graph as Conway's Game of Life
        env:
          GH_PAT: ${{ secrets.GH_PAT }}   # needs read:user scope — see SETUP.md
          TARGET_USER: SKYLORD69-PY
        run: python scripts/game_of_life.py

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: re-simulate game of life from latest contributions [skip ci]"
          file_pattern: "assets/game-of-life.svg"
