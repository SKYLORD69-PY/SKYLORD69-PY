name: 🐍 Generate Contribution Snake

"on":
  schedule:
    # Once a day at midnight UTC — contribution data only changes daily anyway
    - cron: "0 0 * * *"
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: snake-generation
  cancel-in-progress: false

jobs:
  generate:
    name: Render contribution-grid snake SVG
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: 🐍 Generate snake SVG from the contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Push SVG to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
