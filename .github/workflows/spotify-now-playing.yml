name: Spotify Now Playing

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-repository-commit
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Allow at most two repository commits per UTC day
        id: commit_gate
        run: |
          git fetch origin main --quiet
          commits_today=$(git rev-list --count --since="$(date -u +%Y-%m-%d) 00:00:00 UTC" origin/main)
          echo "Repository commits today: $commits_today"
          if [ "$commits_today" -lt 2 ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "Daily commit limit reached; skipping this update."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch now-playing / last-played and render card
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: python scripts/spotify_now_playing.py

      - name: Commit changes
        if: steps.commit_gate.outputs.allowed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: refresh spotify now-playing card [skip ci]"
          file_pattern: "assets/spotify.svg"
