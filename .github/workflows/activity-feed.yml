name: Activity Feed

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-repository-commit
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Allow at most two repository commits per UTC day
        id: commit_gate
        run: |
          git fetch origin main --quiet
          commits_today=$(git rev-list --count --since="$(date -u +%Y-%m-%d) 00:00:00 UTC" origin/main)
          echo "Repository commits today: $commits_today"
          if [ "$commits_today" -lt 2 ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "Daily commit limit reached; skipping this update."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update recent activity (+ blog posts if configured)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_USER: SKYLORD69-PY
          # Optional. Settings -> Secrets and variables -> Actions -> Variables tab.
          # Leave unset if you don't have a blog yet; that section just won't render.
          BLOG_RSS_URL: ${{ vars.BLOG_RSS_URL }}
        run: python scripts/activity_feed.py

      - name: Commit changes
        if: steps.commit_gate.outputs.allowed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: sync recent activity feed [skip ci]"
          file_pattern: "README.md"
