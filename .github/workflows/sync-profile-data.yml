name: Sync Profile Data

on:
  workflow_dispatch: {}       # lets you click "Run workflow" in the Actions tab to update on demand

permissions:
  contents: write

concurrency:
  group: daily-repository-commit
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Allow at most two repository commits per UTC day
        id: commit_gate
        run: |
          git fetch origin main --quiet
          commits_today=$(git rev-list --count --since="$(date -u +%Y-%m-%d) 00:00:00 UTC" origin/main)
          echo "Repository commits today: $commits_today"
          if [ "$commits_today" -lt 2 ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "Daily commit limit reached; skipping this update."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update "Currently Building" repo table
        id: repos
        continue-on-error: true   # isolate failure: stats should still get a chance to run below
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_USER: SKYLORD69-PY
        run: python scripts/update_repos.py

      - name: Generate stats + top-languages cards
        id: stats
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}   # optional: enables follower + yearly-contribution counts
          TARGET_USER: SKYLORD69-PY
        run: python scripts/generate_stats.py

      - name: Fail the run if BOTH steps failed
        if: steps.repos.outcome == 'failure' && steps.stats.outcome == 'failure'
        run: |
          echo "::error::Both update_repos.py and generate_stats.py failed this run."
          exit 1

      - name: Commit changes
        if: steps.commit_gate.outputs.allowed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: sync repo table + stats cards [skip ci]"
          file_pattern: "README.md assets/stats.svg assets/top-langs.svg"
