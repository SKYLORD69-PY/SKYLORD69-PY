name: Generate Snake (Contribution Grid)

# Generates the animated contribution-snake SVGs referenced in README.md
# and publishes them to the `output` branch, e.g.:
#   https://raw.githubusercontent.com/SKYLORD69-PY/SKYLORD69-PY/output/github-contribution-grid-snake-dark.svg

on:
  schedule:
    - cron: "0 */6 * * *"   # refresh every 6 hours
  workflow_dispatch: {}
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: SKYLORD69-PY
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
